[package]
name = "world-ledger"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <you@example.com>"]
description = "A simple, scalable, resilient blockchain base layer to serve as the World Ledger."
license = "MIT OR Apache-2.0"

# Enable criterion for benchmarking
[[bench]]
name = "state_transition"
harness = false
path = "bench/state_transition.rs"

[dependencies]
# Core Hashing
blake3 = "1.5"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async Runtime
tokio = { version = "1.36", features = ["full"] }

# P2P Networking (libp2p)
libp2p = { version = "0.52", features = ["tcp", "dns", "identify", "kad", "gossipsub", "noise", "yamux", "request-response", "mdns"] }

# Merkle Tree (optional - you can replace with your own later)
merkle_light = "0.4"

# Cryptography (signatures, elliptic curves, etc.)
ed25519-dalek = "1.0"
rand = "0.8.5"
rand_chacha = "0.3.1"

# Post-quantum cryptography
pqcrypto-dilithium = "0.5.0"
pqcrypto-traits = "0.3.5"

# Erasure Coding
reed-solomon-erasure = "6.0"

# STARK-related (optional starter lib, or replace with Winterfell later)
winter-prover = "0.5"
winter-crypto = "0.5"
# Additional STARK libraries
winterfell = "0.7"
risc0-zkvm = "0.19"

# Storage
rocksdb = { version = "0.21", features = ["multi-threaded-cf"] }

# Logging
log = "0.4"
env_logger = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
hex = "0.4.3"
thiserror = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "cargo"] }
bip32 = "0.5"
bip39 = "2.0"
slip10 = "0.4"
crypto_box = "0.9"
secrecy = "0.8"
zeroize = "1.6"
uuid = { version = "1.7", features = ["v4"] }
bincode = "1.3.3"

# JSON-RPC dependencies
jsonrpc-core = "18.0.0"
jsonrpc-http-server = "18.0.0"
jsonrpc-derive = "18.0.0"

# Smart contract execution
wasmer = "3.1.1"
wasmer-compiler-cranelift = "3.1.1"
sha3 = "0.10.8"

# Monitoring & Telemetry
prometheus = "0.13"
lazy_static = "1.4"
tracing-log = "0.1"
tracing-appender = "0.2"

[dev-dependencies]
# Testing tools
proptest = "1.4"
tempfile = "3.8"
criterion = "0.4"
rand_chacha = "0.3.1"